services:
  postgres-db:
    image: postgres:latest
    container_name: postgres-maternidade
    environment:
      POSTGRES_DB: maternidade_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maternidade_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: maternidade-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/maternidade_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: maternidade-frontend
    ports:
      - "5173:5173"  # Mapeia a porta 5173 do seu PC para o container
    depends_on:
      - backend

volumes:
  pgdata: