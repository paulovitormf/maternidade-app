services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-maternidade

    environment:
      MYSQL_DATABASE: maternidade
      MYSQL_ROOT_PASSWORD: 1234

    ports:
      - "3306:3306"

    volumes:
      - mysqldata:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: maternidade-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/maternidade
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234

    depends_on:
      mysql-db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: maternidade-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  mysqldata: